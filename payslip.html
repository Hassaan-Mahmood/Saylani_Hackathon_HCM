<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Payslip - HCM Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <section class="content">
        <div class="card no-print" style="margin-bottom:20px">
          <div class="toolbar" style="margin-bottom:0">
            <label for="payMonth"><b>Month</b></label>
            <input class="input" type="month" id="payMonth" style="max-width:200px">
            <button class="btn btn-primary" onclick="generatePayslip()">Generate Payslip</button>
            <button class="btn btn-ghost hidden" id="printBtn" onclick="printPayslip()">🖨️ Print / Save as PDF</button>
          </div>
        </div>

        <div id="payslipBox">
          <div class="card empty no-print">Choose a month and click “Generate Payslip”.</div>
        </div>
      </section>
    </div>
  </div>

  <div class="toast-container" id="toastBox"></div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/helper.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/leave.js"></script>
  <script>
    // Employees only
    if (initPage("employee", "payslip", "My Payslip", "Generate and print your monthly payslip.")) {
      document.getElementById("payMonth").value = todayStr().slice(0, 7);
      generatePayslip();
    }
  </script>
</body>
</html>
