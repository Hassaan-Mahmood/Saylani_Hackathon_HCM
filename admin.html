<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Dashboard - HCM Lite</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="app-layout">
            <aside class="sidebar" id="sidebar"></aside>

            <div class="main">
                <header class="topbar" id="topbar"></header>

                <section class="content">
                    <!-- Six stat cards -->
                    <div class="stat-grid" id="statGrid"></div>

                    <div class="grid-2">
                        <div class="card">
                            <div class="card-head">
                                <h3>📊 Attendance by Department</h3>
                                <span class="tag">Today</span>
                            </div>
                            <div id="deptChart"></div>
                        </div>
                        <div class="card">
                            <div class="card-head">
                                <h3>📈 7-Day Attendance Trend</h3>
                                <span class="tag">Last 7 Days</span>
                            </div>
                            <div id="trendChart"></div>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="card">
                            <div class="card-head">
                                <h3>🗓️ Today's Attendance</h3>
                            </div>
                            <div class="table-wrap">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Employee</th>
                                            <th>Status</th>
                                            <th>Check-in</th>
                                            <th>Check-out</th>
                                        </tr>
                                    </thead>
                                    <tbody id="todayBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-head">
                                <h3>💡 Smart Helper</h3>
                            </div>
                            <div id="smartHelper"></div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <div class="toast-container" id="toastBox"></div>

        <script src="js/storage.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/helper.js"></script>
        <script src="js/employees.js"></script>
        <script src="js/attendance.js"></script>
        <script src="js/leave.js"></script>
        <script>
            // Admin only. Non-admins are redirected by requireLogin().
            if (initPage("admin", "dashboard", "Executive Overview")) {
                renderAdminDashboard();
            }
        </script>
    </body>
</html>
