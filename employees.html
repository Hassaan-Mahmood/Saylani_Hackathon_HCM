<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Employees - HCM Lite</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="app-layout">
            <aside class="sidebar" id="sidebar"></aside>

            <div class="main">
                <header class="topbar" id="topbar"></header>

                <section class="content">
                    <div class="card">
                        <div class="toolbar">
                            <input
                                class="input"
                                id="searchInput"
                                placeholder="🔍 Search name, email, role..."
                                oninput="renderEmployees()"
                            />
                            <select
                                class="input"
                                id="deptFilter"
                                style="max-width: 220px"
                                onchange="renderEmployees()"
                            >
                                <option value="all">All departments</option>
                            </select>
                            <span class="muted small" id="empCount"></span>
                            <span class="spacer"></span>
                            <button
                                class="btn btn-primary"
                                onclick="openEmployeeModal()"
                            >
                                ＋ Add Employee
                            </button>
                        </div>

                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Employee</th>
                                        <th>Department</th>
                                        <th>Designation</th>
                                        <th>Monthly Salary</th>
                                        <th>Joined</th>
                                        <th class="text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="empBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <!-- Add / Edit modal -->
        <div class="modal-backdrop" id="empModal">
            <div class="modal">
                <h3 id="empModalTitle">Add Employee</h3>
                <input type="hidden" id="empId" />
                <div class="grid-form">
                    <div class="field">
                        <label>Full name *</label
                        ><input class="input" id="empName" />
                    </div>
                    <div class="field">
                        <label>Email (login) *</label
                        ><input class="input" type="email" id="empEmail" />
                    </div>
                    <div class="field">
                        <label>Password</label
                        ><input
                            class="input"
                            type="password"
                            id="empPassword"
                        />
                    </div>
                    <div class="field">
                        <label>Department *</label
                        ><input
                            class="input"
                            id="empDept"
                            list="deptList"
                            placeholder="e.g. Engineering"
                        /><datalist id="deptList"></datalist>
                    </div>
                    <div class="field">
                        <label>Designation</label
                        ><input
                            class="input"
                            id="empDesignation"
                            placeholder="e.g. Developer"
                        />
                    </div>
                    <div class="field">
                        <label>Monthly base salary *</label
                        ><input
                            class="input"
                            type="number"
                            min="0"
                            id="empSalary"
                        />
                    </div>
                    <div class="field full">
                        <label>Join date *</label
                        ><input class="input" type="date" id="empJoin" />
                    </div>
                </div>
                <div class="modal-actions">
                    <button
                        class="btn btn-ghost"
                        onclick="closeModal('empModal')"
                    >
                        Cancel
                    </button>
                    <button class="btn btn-primary" onclick="saveEmployee()">
                        Save
                    </button>
                </div>
            </div>
        </div>

        <div class="toast-container" id="toastBox"></div>

        <script src="js/storage.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/helper.js"></script>
        <script src="js/employees.js"></script>
        <script src="js/attendance.js"></script>
        <script src="js/leave.js"></script>
        <script>
            if (
                initPage(
                    "admin",
                    "employees",
                    "Employees",
                    "Add, edit and manage your team.",
                )
            ) {
                renderEmployees();
            }
        </script>
    </body>
</html>
